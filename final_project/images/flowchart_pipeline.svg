<svg width="680" height="490" viewBox="0 0 680 490" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="460" y="20" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="478" y="31" font-size="11" fill="#444">ESP32-CAM</text>
  <rect x="460" y="38" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="478" y="49" font-size="11" fill="#444">Python server</text>
  <rect x="460" y="56" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="478" y="67" font-size="11" fill="#444">WiFi / HTTP</text>
  <rect x="460" y="74" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="478" y="85" font-size="11" fill="#444">ESP32 controller</text>
  <rect x="460" y="92" width="12" height="12" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="478" y="103" font-size="11" fill="#444">Output</text>

  <!-- 1. ESP32-CAM -->
  <rect x="130" y="30" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="260" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">ESP32-CAM</text>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#534AB7">MJPEG stream on port 80</text>

  <line x1="260" y1="86" x2="260" y2="106" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. MediaPipe -->
  <rect x="130" y="106" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="260" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Hand gesture detection</text>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#185FA5">6 gestures mapped to light modes</text>

  <line x1="260" y1="162" x2="260" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Decision diamond -->
  <polygon points="260,182 392,208 260,234 128,208" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="260" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Gesture held &gt;= 0.8 s?</text>

  <!-- No branch -->
  <line x1="128" y1="208" x2="62" y2="208" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="120" y="198" text-anchor="end" font-size="11" fill="#777">No → retry</text>

  <!-- Yes branch -->
  <line x1="260" y1="234" x2="260" y2="256" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="272" y="248" font-size="11" fill="#555">Yes</text>

  <!-- 4. HTTP -->
  <rect x="130" y="256" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="260" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">HTTP GET to ESP32</text>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#0F6E56">/gesture?mode={MODE}</text>

  <line x1="260" y1="312" x2="260" y2="332" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. ESP32 controller -->
  <rect x="130" y="332" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="260" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">ESP32 controller</text>
  <text x="260" y="374" text-anchor="middle" font-size="12" fill="#993C1D">Applies gesture + LDR logic</text>

  <line x1="260" y1="388" x2="260" y2="408" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Outputs -->
  <rect x="130" y="408" width="260" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="260" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#27500A">NeoPixel ring + LCD</text>
  <text x="260" y="450" text-anchor="middle" font-size="12" fill="#3B6D11">24 LEDs + active mode display</text>
</svg>
