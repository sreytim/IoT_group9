<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Input: Gesture -->
  <rect x="60" y="30" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="155" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Gesture input</text>
  <text x="155" y="72" text-anchor="middle" font-size="12" fill="#993C1D">via HTTP GET</text>

  <!-- Input: LDR -->
  <rect x="430" y="30" width="190" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="525" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">LDR sensor</text>
  <text x="525" y="72" text-anchor="middle" font-size="12" fill="#854F0B">reads every 500 ms</text>

  <!-- Converging lines -->
  <path d="M155,86 L155,112 L340,112" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M525,86 L525,112 L340,112" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <line x1="340" y1="112" x2="340" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="340,130 472,158 340,186 208,158" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="340" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">LDR change &gt; threshold?</text>

  <!-- Yes label + arrow to AUTO -->
  <text x="204" y="148" text-anchor="end" font-size="11" fill="#777">Yes</text>
  <path d="M208,158 L120,158 L120,214" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- No label + arrow to GESTURE -->
  <text x="476" y="148" text-anchor="start" font-size="11" fill="#777">No</text>
  <path d="M472,158 L560,158 L560,214" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AUTO mode box -->
  <rect x="40" y="214" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="120" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Auto mode</text>
  <text x="120" y="256" text-anchor="middle" font-size="12" fill="#854F0B">Dark=ON, Sunny=OFF</text>

  <!-- GESTURE mode box -->
  <rect x="480" y="214" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="560" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Gesture mode</text>
  <text x="560" y="256" text-anchor="middle" font-size="12" fill="#993C1D">from HTTP command</text>

  <!-- Merge lines -->
  <path d="M120,270 L120,326 L340,326" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M560,270 L560,326 L340,326" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <line x1="340" y1="326" x2="340" y2="346" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="210" y="346" width="260" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="340" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#27500A">NeoPixel + LCD update</text>
  <text x="340" y="388" text-anchor="middle" font-size="12" fill="#3B6D11">LED color + mode name</text>
</svg>
